# Release for freewheel: on a version tag (started by release-please.yml
# with workflow_dispatch on the tag it made, or by a pushed v* tag), runs
# the full ci.yml test matrix, then builds the portable packages and
# uploads them to the tag's PUBLISHED GitHub Release (no installer):
#   freewheel-<ver>-windows-x64.zip      freewheel.exe only
#   freewheel-<ver>-macos-universal.zip  freewheel.app (universal; signed and
#                                         notarized once the APPLE_* secrets
#                                         exist, ad-hoc signed until then)
#   <package>.sig                        minisign signature by the updater key,
#                                         bound to the version
#   latest.json                          the manifest the in-app updater reads
#                                         (version, the user-facing notes,
#                                         each platform's url and signature)
# The updater pubkey (a public variable) is baked into the binaries at
# build; the build jobs hold no updater secret. The signing key lives only
# in the protected 'release' environment and only in the sign step's env.
# Then the published latest.json and every signature are verified, and
# update-e2e updates the previous release to this one on Windows.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/ci.yml

  # The tag's release, published, and its notes: release-please made it; for
  # a hand-pushed tag it is made here with GitHub's generated notes. The
  # release keeps those notes in full (as CHANGELOG.md does); the app's
  # What's new gets the user-facing ones: developer-only bullets dropped,
  # commit hashes stripped (scripts/release-notes.mjs filter, the same
  # script the Simulator's "Next release" notes and the update e2e use).
  # Hand-written notes win: with release-notes/v<version>.md in the tag, that
  # file becomes both the release body and What's new.
  notes:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      body: ${{ steps.notes.outputs.body }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "freewheel $GITHUB_REF_NAME" --generate-notes
          fi
          test "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = false
          if node scripts/release-notes.mjs curated --version "${GITHUB_REF_NAME#v}" --out "$RUNNER_TEMP/curated.md"; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/curated.md"
          fi
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/release-notes.md"
          node scripts/release-notes.mjs filter --version "${GITHUB_REF_NAME#v}" --in "$RUNNER_TEMP/release-notes.md" --out "$RUNNER_TEMP/user-notes.md"
          echo "What's new will show:"
          cat "$RUNNER_TEMP/user-notes.md"
          {
            echo "body<<FREEWHEEL_NOTES_EOF"
            cat "$RUNNER_TEMP/user-notes.md"
            echo "FREEWHEEL_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

  # One portable package per OS, the pubkey baked in; the only secrets are
  # the macOS signing ones (empty until Apple secrets exist: ad-hoc signed).
  build:
    needs: [test, notes]
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            package: windows
          - os: macos-15
            package: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      # Installs exactly the toolchain pinned in rust-toolchain.toml (1.99.1),
      # with the aarch64 and x86_64 Apple targets the universal build needs.
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install
          rustc --version

      - run: npm ci

      # release-please bumps the version files in its PR; a tag that does not
      # match them would make the updater offer the wrong version.
      - name: The tag matches the app version
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME is not v$version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # The exe with the UI embedded, no installer bundle.
      - name: Build freewheel.exe (Windows)
        if: runner.os == 'Windows'
        env:
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: npm run tauri -- build --no-bundle -- --locked

      - name: Build freewheel.app (macOS)
        if: runner.os == 'macOS'
        env:
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run tauri -- build --target universal-apple-darwin --bundles app -- --locked

      # What ships: no e2e-only code and the updater pubkey baked in; on
      # Windows only system DLLs and `--simulate --smoke` starts.
      - name: Check the shipped binary
        shell: bash
        env:
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            bin=target/release/freewheel.exe
            node scripts/check-windows-exe.mjs "$bin"
          else
            app=target/universal-apple-darwin/release/bundle/macos/freewheel.app
            bin=$app/Contents/MacOS/freewheel
            codesign --verify --deep --strict --verbose=2 "$app"
            lipo -archs "$bin"
          fi
          node scripts/check-release-binary.mjs "$bin" --pubkey "$TAURI_UPDATER_PUBKEY"

      - name: Package
        shell: bash
        run: |
          node scripts/portable-release.mjs package --os ${{ matrix.package }} --version "$VERSION" --out packages \
            --exe target/release/freewheel.exe --app target/universal-apple-darwin/release/bundle/macos/freewheel.app
          ls -la packages

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-${{ matrix.package }}
          path: packages
          if-no-files-found: error
          retention-days: 7

  # Signs each package with the updater key, writes latest.json with the
  # release's notes, verifies all of it locally, then uploads to the release.
  publish:
    needs: [build, notes]
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          merge-multiple: true
          path: packages

      - name: Version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Sign the packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for f in packages/*.zip; do
            node node_modules/@tauri-apps/cli/tauri.js signer sign --app-version "$VERSION" "$f" > /dev/null
            test -s "$f.sig"
          done

      - name: Write and verify latest.json
        env:
          NOTES: ${{ needs.notes.outputs.body }}
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
          node scripts/portable-release.mjs manifest --version "$VERSION" --notes-file "$RUNNER_TEMP/notes.md" --dir packages \
            --base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME" > packages/latest.json
          node scripts/check-latest-json.mjs packages/latest.json
          node scripts/verify-update-sig.mjs packages/latest.json --version "$GITHUB_REF_NAME" --dir packages
          ls -la packages

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = false
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber packages/*

  # Checks the published latest.json lists every platform the updater serves,
  # carries this version and the notes, and that every download verifies
  # against the updater pubkey (what the running app checks).
  latest-json:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Check and verify the release's latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern latest.json
          test "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = false
          node scripts/check-latest-json.mjs latest.json
          node scripts/verify-update-sig.mjs latest.json --version "$GITHUB_REF_NAME"

  # The previous published release, unzipped in a folder, updates itself to this one.
  update-e2e:
    needs: latest-json
    uses: ./.github/workflows/update-e2e.yml
