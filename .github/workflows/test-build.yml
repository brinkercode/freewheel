# Test build for freewheel: on demand or on a push to main, builds an
# unsigned NSIS installer and the portable freewheel.exe on a hosted Windows
# runner and uploads them as an artifact kept for 1 day. Updater artifacts
# are off, so no signing secret and no updater pubkey are needed.
name: test-build

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: test-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: test build (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      # Installs exactly the toolchain pinned in rust-toolchain.toml (1.99.1).
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ". -> target"

      - run: npm ci

      # The Tauri CLI directly, not `npm run tauri` (the release wrapper that
      # requires the signing secrets and the updater pubkey).
      - name: Build unsigned NSIS installer and freewheel.exe
        shell: bash
        run: npx tauri build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}' -- --locked

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: freewheel-windows-${{ github.sha }}
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/freewheel.exe
          if-no-files-found: error
          retention-days: 1
