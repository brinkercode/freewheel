# Test build for freewheel: on demand or on a push to main, builds the
# portable freewheel.exe on a hosted Windows runner (no installer, no
# updater pubkey, no signing: it can't update itself), runs the zero-install
# gate and the shipped-binary check release.yml runs, and uploads
# freewheel.exe and freewheel-simulate.cmd as two artifacts kept for 1 day,
# each a plain file (`archive: false`): the download is the exe itself.
name: test-build

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: test-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  windows:
    name: test build (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      # The whole history: the next release's notes come from it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      # Installs exactly the toolchain pinned in rust-toolchain.toml (1.99.1).
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ". -> target"

      - run: npm ci

      # The next release's notes for the Simulator's "Next release (real
      # notes)" (scripts/release-notes.mjs, embedded by src-tauri build.rs).
      - name: The next release's notes
        shell: bash
        run: |
          node scripts/release-notes.mjs preview --out "$RUNNER_TEMP/next-notes.md"
          cat "$RUNNER_TEMP/next-notes.md"
          echo "FREEWHEEL_NEXT_NOTES_FILE=$RUNNER_TEMP/next-notes.md" >> "$GITHUB_ENV"

      # The Tauri CLI directly, not `npm run tauri` (the release wrapper that
      # requires the updater pubkey). No bundle: the exe is the app.
      - name: Build freewheel.exe
        shell: bash
        run: npx tauri build --no-bundle -- --locked

      # Zero-install gate and shipped-binary check on what ships, as release.yml.
      - name: Import check and smoke (built exe)
        run: node scripts/check-windows-exe.mjs target/release/freewheel.exe
      - name: No e2e-only code in the exe
        run: node scripts/check-release-binary.mjs target/release/freewheel.exe

      # Not zipped: each artifact is the file itself, named after it
      # (upload-artifact v7 `archive: false` takes one file per upload).
      # freewheel-simulate.cmd starts `freewheel.exe --simulate` from the
      # same folder.
      - name: Upload freewheel.exe
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: target/release/freewheel.exe
          archive: false
          if-no-files-found: error
          retention-days: 1

      - name: Upload freewheel-simulate.cmd
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: src-tauri/windows/freewheel-simulate.cmd
          archive: false
          if-no-files-found: error
          retention-days: 1
