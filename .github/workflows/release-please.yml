# Release-please for freewheel: on each push to main it keeps one release PR
# open (the next version from the conventional commits, the CHANGELOG and
# the version in package.json, tauri.conf.json and the Cargo files). Merging
# that PR tags vX.Y.Z and makes its GitHub release as a DRAFT with the notes
# (release-please-config.json "draft"; "force-tag-creation" makes the tag at
# once, which a draft alone would not, so release.yml can run on it and
# release-please finds this release next time); the tag starts release.yml,
# which builds and uploads the signed files and latest.json (with the same
# notes) to the draft and publishes it, as the latest release, only once all
# of them are there and checked.
#
# release-please acts with RELEASE_PLEASE_TOKEN, not GITHUB_TOKEN: Actions
# here may not open pull requests, and a PR or tag made with GITHUB_TOKEN
# starts no other workflow. The secret is a fine-grained token on this
# repository only (Contents, Pull requests and Issues: read and write; Issues
# for the release PR's labels), used only as the action's token. With it the
# release PR gets its own pull_request runs (every required check, no
# approval: the owner's PR) and the tag starts release.yml by itself, so
# nothing is dispatched here; a dispatch as well would build the release
# twice. GITHUB_TOKEN stays read-only.
name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
