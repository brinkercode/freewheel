# End to end on a hosted Windows runner: builds the real freewheel.exe (the
# UI embedded, as `tauri build` serves it), starts it with --simulate under
# WebDriver (the msedgedriver matching the runner's WebView2, attached to
# the app's DevTools port) and clicks through the first run, every settings tab, the key
# panel and the Simulator window's controls, requiring both windows to answer
# within 5 s after every action (scripts/e2e-windows.mjs). Screenshots of
# every step go to the 'e2e-screenshots' artifact; the exe plus a
# double-click freewheel-simulate.cmd go to 'freewheel-windows-simulate'.
#
# The update job proves the portable update without a published release:
# it builds freewheel.exe twice (version A, the repo's, and B, the next
# minor), both e2e builds (the `e2e` feature: the DevTools port and the
# updater's manifest URL override) with a throwaway updater key generated in
# the job baked in, packs each as the release does
# (scripts/portable-release.mjs), signs B's zip, unzips A into a folder with
# a populated config, serves B from 127.0.0.1 (plus a tampered copy) and
# drives A: Check -> available -> a tampered B rejected with A intact ->
# Download (progress) -> Restart -> the same path runs B with What's new, the
# config unchanged, freewheel.exe.old and the temp download gone
# (scripts/e2e-update-windows.mjs). Screenshots of every state go to the
# 'e2e-update-screenshots' artifact.
name: e2e-windows

# No paths-ignore: these jobs are required checks, so a docs-only PR must
# run them too (a skipped required check never reports and blocks the merge).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: e2e (windows-2025)
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      # Installs exactly the toolchain pinned in rust-toolchain.toml.
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ". -> target"
          cache-bin: "true"

      - run: npm ci
      - run: npm run build

      # The release exe with the built UI embedded (custom-protocol), as
      # `tauri build` makes it: no dev server. `e2e` adds the stand-ins for
      # the OS file dialogs (src-tauri/src/e2e.rs, active only in --simulate
      # with FREEWHEEL_E2E_DIALOG_DIR set); shipped builds never have it.
      - name: Build freewheel.exe
        run: cargo build --release --locked -p freewheel --features tauri/custom-protocol,e2e

      # msedgedriver must match the WebView2 runtime the app runs in.
      - name: Install the msedgedriver matching WebView2
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $version = (Get-ItemProperty $key).pv
          Write-Host "WebView2 runtime $version"
          $zip = "$env:RUNNER_TEMP\edgedriver.zip"
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\edgedriver" -Force
          & "$env:RUNNER_TEMP\edgedriver\msedgedriver.exe" --version

      - name: Click through freewheel --simulate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force e2e-shots | Out-Null
          Get-ChildItem env: | Where-Object Name -like 'WEBVIEW2*' | Format-Table -AutoSize
          # msedgedriver attaches to the app's WebView2 DevTools port (the
          # script starts the app with it open: actions/runner-images#14738
          # breaks tauri-driver's launch on windows-2025), verbose log kept.
          $driver = Start-Process -FilePath "$env:RUNNER_TEMP\edgedriver\msedgedriver.exe" -ArgumentList '--port=4444','--verbose',"--log-path=$PWD\e2e-shots\msedgedriver.log" -PassThru -NoNewWindow
          $deadline = (Get-Date).AddSeconds(30)
          do { Start-Sleep -Milliseconds 300; $up = Test-NetConnection 127.0.0.1 -Port 4444 -InformationLevel Quiet -WarningAction SilentlyContinue } until ($up -or (Get-Date) -gt $deadline)
          if (-not $up) { throw "msedgedriver did not start" }
          node scripts/e2e-windows.mjs --port 9222 --app target/release/freewheel.exe --out e2e-shots
          $code = $LASTEXITCODE
          Stop-Process -Id $driver.Id -Force -ErrorAction SilentlyContinue
          Get-Process freewheel -ErrorAction SilentlyContinue | Stop-Process -Force
          exit $code

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-screenshots
          path: e2e-shots
          retention-days: 14
          if-no-files-found: warn

      - name: Keep the app's logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-logs
          path: ~/AppData/Local/freewheel/data/logs
          retention-days: 14
          if-no-files-found: ignore

      # What the owner downloads: unzip, double-click freewheel-simulate.cmd.
      - name: Stage the clickable simulate build
        if: success()
        shell: bash
        run: |
          mkdir -p simulate-build
          cp target/release/freewheel.exe src-tauri/windows/freewheel-simulate.cmd simulate-build/
      - name: Upload the clickable simulate build
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: freewheel-windows-simulate
          path: simulate-build
          retention-days: 14
          if-no-files-found: error

  # What freewheel costs a PC: the release-built exe (as `tauri build` makes
  # it, no e2e feature) and its portable zip, run normally (no Speed
  # Editor attached) and with --simulate. Records exe/zip size, disk
  # written, RAM of freewheel.exe plus its WebView2 processes with the window
  # open and closed to the tray, and idle CPU; fails over the budgets in
  # scripts/footprint-budgets.json and writes the table to the job summary.
  footprint:
    name: footprint (windows-2025)
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      TAURI_CLI: node_modules/@tauri-apps/cli/tauri.js
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ". -> target"
          cache-bin: "true"

      - run: npm ci

      # The release build without the updater key, packed as the release packs it.
      - name: Build freewheel.exe and the portable zip
        shell: bash
        run: |
          node "$TAURI_CLI" build --ci --no-bundle
          node scripts/portable-release.mjs package --os windows --version "$(node -p "require('./src-tauri/tauri.conf.json').version")" --out footprint-package

      - name: Measure the footprint
        shell: bash
        run: |
          zip=$(ls footprint-package/*.zip | head -n 1)
          node scripts/footprint-windows.mjs --app target/release/freewheel.exe --package "$zip" --budgets scripts/footprint-budgets.json --out footprint

      - name: Upload the measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: footprint
          path: footprint
          retention-days: 14
          if-no-files-found: warn

  update:
    name: update e2e (windows-2025, local release server)
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      SERVER_PORT: "8719"
      TAURI_CLI: node_modules/@tauri-apps/cli/tauri.js
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ". -> target"
          cache-bin: "true"

      - run: npm ci

      # A throwaway key pair, made here and gone with the runner: never the
      # release key. Both builds bake in its pubkey; B's zip is signed with it.
      - name: Make a test updater key
        shell: bash
        run: |
          key="$RUNNER_TEMP/e2e-updater.key"
          node "$TAURI_CLI" signer generate --ci -p "" -w "$key" -f > /dev/null
          echo "E2E_UPDATER_KEY=$key" >> "$GITHUB_ENV"
          from=$(node -p "require('./src-tauri/tauri.conf.json').version")
          to=$(node scripts/e2e-update-config.mjs --next "$from")
          echo "FROM_VERSION=$from" >> "$GITHUB_ENV"
          echo "TO_VERSION=$to" >> "$GITHUB_ENV"
          echo "update e2e: $from -> $to"

      # The release's packaging and signing, with the test key: B's zip, its
      # .sig (bound to B's version) and latest.json; A's zip.
      - name: Build and pack version B, then A
        shell: bash
        run: |
          export FREEWHEEL_UPDATER_PUBKEY="$(cat "$E2E_UPDATER_KEY.pub")"
          for v in "$TO_VERSION" "$FROM_VERSION"; do
            node "$TAURI_CLI" build --ci --no-bundle --features e2e --config "$(node scripts/e2e-update-config.mjs "$v")" -- --locked
            node scripts/portable-release.mjs package --os windows --version "$v" --out "$RUNNER_TEMP/release-$v" --exe target/release/freewheel.exe
          done
          zip="$RUNNER_TEMP/release-$TO_VERSION/freewheel-$TO_VERSION-windows-x64.zip"
          node "$TAURI_CLI" signer sign -f "$E2E_UPDATER_KEY" -p "" --app-version "$TO_VERSION" "$zip" > /dev/null
          node scripts/portable-release.mjs manifest --version "$TO_VERSION" --dir "$RUNNER_TEMP/release-$TO_VERSION" --only windows \
            --base-url "https://github.com/brinkercode/freewheel/releases/download/v$TO_VERSION" > "$RUNNER_TEMP/release-$TO_VERSION/latest.json"
          ls -la "$RUNNER_TEMP"/release-*

      - name: Unzip version A into a folder
        shell: pwsh
        run: |
          Expand-Archive "$env:RUNNER_TEMP\release-$env:FROM_VERSION\freewheel-$env:FROM_VERSION-windows-x64.zip" -DestinationPath "$env:RUNNER_TEMP\portable\freewheel"
          Get-ChildItem "$env:RUNNER_TEMP\portable\freewheel" | Format-Table Name, Length

      - name: Install the msedgedriver matching WebView2
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $version = (Get-ItemProperty $key).pv
          Write-Host "WebView2 runtime $version"
          $zip = "$env:RUNNER_TEMP\edgedriver.zip"
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\edgedriver" -Force
          & "$env:RUNNER_TEMP\edgedriver\msedgedriver.exe" --version

      - name: Update A to B through the settings window
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force e2e-update-shots | Out-Null
          $driver = Start-Process -FilePath "$env:RUNNER_TEMP\edgedriver\msedgedriver.exe" -ArgumentList '--port=4444','--verbose',"--log-path=$PWD\e2e-update-shots\msedgedriver.log" -PassThru -NoNewWindow
          $deadline = (Get-Date).AddSeconds(30)
          do { Start-Sleep -Milliseconds 300; $up = Test-NetConnection 127.0.0.1 -Port 4444 -InformationLevel Quiet -WarningAction SilentlyContinue } until ($up -or (Get-Date) -gt $deadline)
          if (-not $up) { throw "msedgedriver did not start" }
          $b = "$env:RUNNER_TEMP\release-$env:TO_VERSION"
          node scripts/e2e-update-windows.mjs --app "$env:RUNNER_TEMP\portable\freewheel\freewheel.exe" --manifest "$b\latest.json" --package "$b\freewheel-$env:TO_VERSION-windows-x64.zip" --from $env:FROM_VERSION --to $env:TO_VERSION --server-port $env:SERVER_PORT --port 9223 --out e2e-update-shots
          $code = $LASTEXITCODE
          Stop-Process -Id $driver.Id -Force -ErrorAction SilentlyContinue
          Get-Process freewheel -ErrorAction SilentlyContinue | Stop-Process -Force
          exit $code

      - name: The folder's exe is version B
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\portable\freewheel\freewheel.exe"
          $v = (Get-Item $exe).VersionInfo
          $now = "{0}.{1}.{2}" -f $v.FileMajorPart, $v.FileMinorPart, $v.FileBuildPart
          Write-Host "freewheel.exe is $now"
          if ($now -ne $env:TO_VERSION) { throw "freewheel.exe is $now, expected $env:TO_VERSION" }
          if (Test-Path "$exe.old") { throw "freewheel.exe.old is still there" }

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-update-screenshots
          path: e2e-update-shots
          retention-days: 14
          if-no-files-found: warn

      - name: Keep the app's logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-update-logs
          path: ~/AppData/Local/freewheel/data/logs
          retention-days: 14
          if-no-files-found: ignore
