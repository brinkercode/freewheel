# Update end to end for freewheel against the real published releases, on
# a hosted Windows runner: downloads the previous release's exe
# (freewheel-<ver>-windows-x64.exe) into a folder, as a user does, runs that
# app's own updater headless (`freewheel --update-check-and-install`: the
# release manifest on GitHub, the exe for this OS, its signature checked
# against the pubkey built into that release, the exe swapped in place
# under the same name) and requires the same path
# to become the newest release, start (--simulate --smoke), remove the old
# exe it left aside and then report itself up to date, and its What's new
# show the newest release's notes from its GitHub release, formatted
# (scripts/update-e2e-whats-new.mjs over WebDriver). Runs after each
# release (release.yml calls it) and on demand. Public releases only: no
# secrets, read-only token.
name: update-e2e

on:
  workflow_dispatch:
    inputs:
      from:
        description: "Release tag to start from (default: the one before the latest)"
        type: string
        required: false
        default: ""
  workflow_call:
    inputs:
      from:
        description: "Release tag to start from (default: the one before the latest)"
        type: string
        required: false
        default: ""

concurrency:
  group: update-e2e
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  windows:
    name: update e2e (windows-2025, published releases)
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Pick the releases
        id: pick
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FROM: ${{ inputs.from }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 100 \
            --json tagName --jq '.[].tagName' | node scripts/update-e2e.mjs | tee -a "$GITHUB_OUTPUT"

      - name: No older release yet
        if: steps.pick.outputs.skip == 'true'
        shell: bash
        run: echo "::notice::update-e2e needs two published releases; skipped"

      - name: Download the previous release's exe into a folder
        if: steps.pick.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          FROM: ${{ steps.pick.outputs.from }}
          FROM_VERSION: ${{ steps.pick.outputs.from_version }}
        run: |
          gh release download $env:FROM --repo $env:GITHUB_REPOSITORY --pattern "freewheel-$env:FROM_VERSION-windows-x64.exe" --dir "$env:RUNNER_TEMP\freewheel"
          $exe = "$env:RUNNER_TEMP\freewheel\freewheel-$env:FROM_VERSION-windows-x64.exe"
          $v = (Get-Item $exe).VersionInfo
          $found = "{0}.{1}.{2}" -f $v.FileMajorPart, $v.FileMinorPart, $v.FileBuildPart
          Write-Host "downloaded $found"
          if ($found -ne $env:FROM_VERSION) { throw "downloaded $found, expected $env:FROM_VERSION" }
          "FREEWHEEL_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Update with the app's own updater
        if: steps.pick.outputs.skip != 'true'
        shell: pwsh
        env:
          TO_VERSION: ${{ steps.pick.outputs.to_version }}
        run: |
          $exe = $env:FREEWHEEL_EXE
          $run = Start-Process -FilePath $exe -ArgumentList '--update-check-and-install' -Wait -PassThru
          # 0: verified and swapped in; 2: up to date; 3: no pubkey; 1: failed.
          if ($run.ExitCode -ne 0) { throw "update run exit $($run.ExitCode)" }
          $v = (Get-Item $exe).VersionInfo
          $now = "{0}.{1}.{2}" -f $v.FileMajorPart, $v.FileMinorPart, $v.FileBuildPart
          Write-Host "the same path after the update: $now"
          if ($now -ne $env:TO_VERSION) { throw "the exe is $now, expected $env:TO_VERSION" }
          Get-ChildItem "$env:RUNNER_TEMP\freewheel" | Format-Table Name, Length

      - name: The updated app starts, cleans up and is up to date
        if: steps.pick.outputs.skip != 'true'
        shell: pwsh
        run: |
          $exe = $env:FREEWHEEL_EXE
          $run = Start-Process -FilePath $exe -ArgumentList '--update-check-and-install' -Wait -PassThru
          if ($run.ExitCode -ne 2) { throw "second update run exit $($run.ExitCode), expected 2 (up to date)" }
          if (Test-Path "$exe.old") { throw "$exe.old is still there" }
          if ((Get-ChildItem "$env:RUNNER_TEMP\freewheel").Count -ne 1) { throw "the folder holds more than the exe" }
          if (Test-Path "$env:TEMP\freewheel-update") { throw "the update's temp dir is still there" }
          node scripts/check-windows-exe.mjs $exe
          if ($LASTEXITCODE -ne 0) { throw "smoke failed" }

      # msedgedriver must match the WebView2 runtime the app runs in.
      - name: Install the msedgedriver matching WebView2
        if: steps.pick.outputs.skip != 'true'
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $version = (Get-ItemProperty $key).pv
          Write-Host "WebView2 runtime $version"
          $zip = "$env:RUNNER_TEMP\edgedriver.zip"
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\edgedriver" -Force
          & "$env:RUNNER_TEMP\edgedriver\msedgedriver.exe" --version

      # No notes were stored by the window (the update ran headless): What's
      # new must show the newest release's notes from its GitHub release.
      - name: What's new shows the new release's notes from GitHub
        if: steps.pick.outputs.skip != 'true'
        shell: pwsh
        env:
          FROM_VERSION: ${{ steps.pick.outputs.from_version }}
          TO_VERSION: ${{ steps.pick.outputs.to_version }}
        run: |
          New-Item -ItemType Directory -Force update-e2e-shots | Out-Null
          $driver = Start-Process -FilePath "$env:RUNNER_TEMP\edgedriver\msedgedriver.exe" -ArgumentList '--port=4444','--verbose',"--log-path=$PWD\update-e2e-shots\msedgedriver.log" -PassThru -NoNewWindow
          $deadline = (Get-Date).AddSeconds(30)
          do { Start-Sleep -Milliseconds 300; $up = Test-NetConnection 127.0.0.1 -Port 4444 -InformationLevel Quiet -WarningAction SilentlyContinue } until ($up -or (Get-Date) -gt $deadline)
          if (-not $up) { throw "msedgedriver did not start" }
          node scripts/update-e2e-whats-new.mjs --app $env:FREEWHEEL_EXE --from $env:FROM_VERSION --to $env:TO_VERSION --port 9224 --out update-e2e-shots
          $code = $LASTEXITCODE
          Stop-Process -Id $driver.Id -Force -ErrorAction SilentlyContinue
          Get-CimInstance Win32_Process | Where-Object ExecutablePath -eq $env:FREEWHEEL_EXE | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          exit $code

      - name: Upload What's new screenshots
        if: always() && steps.pick.outputs.skip != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: update-e2e-whats-new
          path: update-e2e-shots
          retention-days: 14
          if-no-files-found: ignore

      - name: Keep the app's logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: update-e2e-logs
          path: ~/AppData/Local/freewheel/data/logs
          retention-days: 7
          if-no-files-found: ignore
