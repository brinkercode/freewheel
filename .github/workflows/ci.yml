# CI for freewheel: a fast Linux lint job that needs no system packages (fmt,
# workflow lint, npm test, UI build), then npm test, the UI build, clippy and
# cargo test on hosted Windows, macOS and Linux runners (Linux also proves
# real key injection: XTest into an X11 window under Xvfb, and the uinput
# virtual keyboard into the kernel). Reusable via workflow_call (the release workflow
# gates on it). Tests use fakes only; no secrets, no real input.
# .opal/checks.toml lists the same Linux checks for local pre-push runs.
name: ci

# No paths-ignore: these jobs are required checks, so a docs-only PR must
# run them too (a skipped required check never reports and blocks the merge).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

# A pull request's newer push cancels its older run; any other run (a push
# to main) has a group of its own, so it never waits behind or is cancelled
# by a newer push (a group holds one pending run and cancels the one before).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Fails formatting in about a minute, before any macOS minutes are spent.
  lint:
    name: lint (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs exactly the toolchain pinned in rust-toolchain.toml (1.99.1),
      # with its rustfmt and clippy components; no floating channel.
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install
          rustc --version

      - run: cargo fmt --all -- --check

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Lint workflows
        run: |
          node scripts/check-workflow.mjs .github/workflows/ci.yml
          node scripts/check-workflow.mjs --release .github/workflows/release.yml

      - run: npm ci
      - run: npm test
      # The UI build runs before cargo: tauri::generate_context! needs dist/.
      - run: npm run build

  test:
    name: test (${{ matrix.os }})
    needs: lint
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15, macos-15-intel, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      # Installs exactly the toolchain pinned in rust-toolchain.toml (1.99.1),
      # with its rustfmt and clippy components; no floating channel.
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ". -> target"

      # WebKitGTK, the tray's AppIndicator, OpenSSL (the updater's TLS), and
      # Xvfb for the real injection test below.
      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev xvfb

      - run: npm ci
      - run: npm test
      # The UI build runs before cargo: tauri::generate_context! needs dist/.
      - run: npm run build

      - run: cargo clippy --workspace --all-targets -- -D warnings

      - run: cargo test --workspace --locked

      # Real key injection on Linux: an XTest key press reaches a focused
      # X11 window (Xvfb), and the uinput virtual keyboard's presses reach
      # the kernel (its own evdev node). The shipped udev rule is linted and
      # installed; a runner has no logged-in seat for `uaccess`, so CI opens
      # /dev/uinput and the test keyboard's event node itself.
      - name: Real key injection (Linux)
        if: runner.os == 'Linux'
        run: |
          udevadm verify --resolve-names=never src-tauri/linux/60-freewheel.rules
          sudo modprobe uinput
          sudo install -m 0644 src-tauri/linux/60-freewheel.rules /etc/udev/rules.d/60-freewheel.rules
          echo 'KERNEL=="event*", ATTRS{name}=="freewheel virtual keyboard", MODE="0666"' | sudo tee /etc/udev/rules.d/99-freewheel-ci.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --subsystem-match=misc --sysname-match=uinput --action=change
          sudo chmod 0666 /dev/uinput
          ls -l /dev/uinput
          xvfb-run -a cargo test -p freewheel --locked -- --ignored --nocapture xtest_ uinput_

      # Zero-install gate: the exe imports only Windows system DLLs (static
      # CRT) and `--simulate --smoke` loads the main window and exits 0.
      # custom-protocol serves the built UI, as `tauri build` does. Skipped on
      # pull requests to keep per-PR CI fast; runs on main, dispatch and tags.
      - name: Build freewheel.exe
        if: runner.os == 'Windows' && github.event_name != 'pull_request'
        run: cargo build --release --locked -p freewheel --features tauri/custom-protocol
      - name: Import check and smoke (built exe)
        if: runner.os == 'Windows' && github.event_name != 'pull_request'
        run: node scripts/check-windows-exe.mjs target/release/freewheel.exe

      # P5: build freewheel.app (no updater artifacts, no signing secrets),
      # register it so tccutil knows com.brinkercode.freewheel, then run the
      # ignored-by-default test that resets its Accessibility and Input
      # Monitoring grants and probes them from inside the bundle.
      - name: P5 permission check inside freewheel.app (macOS)
        if: runner.os == 'macOS'
        env:
          FREEWHEEL_APP: ${{ github.workspace }}/target/debug/bundle/macos/freewheel.app
        run: |
          npx tauri build --debug --bundles app --config '{"bundle":{"createUpdaterArtifacts":false}}'
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f "$FREEWHEEL_APP"
          cargo test -p freewheel --locked -- --ignored p5_
