# The tools the Tauri bundler packs an AppImage with, from the CI cache.
#
# `tauri build --bundles appimage` (tauri-bundler 2.10, @tauri-apps/cli 2.12)
# downloads these from GitHub releases into ~/.cache/tauri unless they are
# already there, and the AppImage plugin's appimagetool downloads the AppImage
# runtime unless LDAI_RUNTIME_FILE names one. A GitHub release outage would
# then fail the build. This action keeps pinned copies (sha256 checked) in
# the actions cache, puts them where the bundler looks and sets
# LDAI_RUNTIME_FILE, so a build with a cache hit downloads nothing.
#
# On a cache miss each file is downloaded with retries, checked against its
# sha256 and saved to the cache right away (not at the end of the job, so a
# later failing step still leaves the cache filled). Every copy, restored or
# downloaded, is checked against its sha256 before it is used.
#
# Bump a version: change its URL and sha256 below and the cache key; the
# names in ~/.cache/tauri follow tauri-bundler's
# src/bundle/linux/appimage/linuxdeploy.rs (prepare_tools).
name: AppImage packaging tools
description: Puts the pinned, sha256-checked AppImage packaging tools where the Tauri bundler looks, from the CI cache.

runs:
  using: composite
  steps:
    - name: Restore the AppImage packaging tools
      id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/freewheel-appimage-tools
        key: appimage-tools-${{ runner.os }}-x86_64-linuxdeploy-07333c6-apprun-old-plugin-appimage-1-alpha-20250213-1-runtime-20251108

    - name: Download the missing AppImage packaging tools (pinned, checked sha256)
      shell: bash
      run: |
        set -euo pipefail
        store="$HOME/.cache/freewheel-appimage-tools"
        mkdir -p "$store"
        # name in the store, sha256, URL
        while read -r name sha url; do
          if [ -f "$store/$name" ] && echo "$sha  $store/$name" | sha256sum -c --status -; then
            echo "$name: from the cache"
            continue
          fi
          echo "$name: downloading $url"
          curl --fail --silent --show-error --location --retry 8 --retry-all-errors --retry-delay 15 \
            --output "$store/$name.part" "$url"
          echo "$sha  $store/$name.part" | sha256sum -c -
          mv "$store/$name.part" "$store/$name"
        done <<'EOF'
        AppRun-x86_64 f30140a43a0a59e46db21bdefdf749b9e9f2c6946e92afabbacf98b8ae73fb4f https://github.com/tauri-apps/binary-releases/releases/download/apprun-old/AppRun-x86_64
        linuxdeploy-07333c6-x86_64.AppImage 36a2d7e274d12e1050d0e9ecfe11d339ed54720b2bec464c286d53f8b07f5c62 https://github.com/tauri-apps/binary-releases/releases/download/linuxdeploy-07333c6/linuxdeploy-x86_64.AppImage
        linuxdeploy-plugin-appimage.AppImage 992d502a248e14ab185448ddf6f6e7d25558cb84d4623c354c3af350c25fccb3 https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-appimage-x86_64.AppImage
        runtime-x86_64 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
        EOF
        # Where tauri-bundler looks (dirs::cache_dir()/tauri), under the names it uses.
        tools="$HOME/.cache/tauri"
        mkdir -p "$tools"
        for name in AppRun-x86_64 linuxdeploy-07333c6-x86_64.AppImage linuxdeploy-plugin-appimage.AppImage; do
          install -m 0755 "$store/$name" "$tools/$name"
        done
        echo "LDAI_RUNTIME_FILE=$store/runtime-x86_64" >> "$GITHUB_ENV"

    - name: Save the AppImage packaging tools
      if: steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/freewheel-appimage-tools
        key: ${{ steps.restore.outputs.cache-primary-key }}
