# CI for freewheel: fmt, clippy, cargo test, npm test and the UI build on
# hosted Windows and macOS runners. Reusable via workflow_call (the release
# workflow gates on it). Tests use fakes only; no secrets, no real input.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      # Installs exactly the toolchain pinned in rust-toolchain.toml (1.99.1),
      # with its rustfmt and clippy components; no floating channel.
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install
          rustc --version

      - name: Lint workflows
        run: node scripts/check-workflow.mjs .github/workflows/ci.yml

      - run: npm ci
      - run: npm test
      # The UI build runs before cargo: tauri::generate_context! needs dist/.
      - run: npm run build

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
