# cargo-deny: the licences freewheel's Rust dependencies may use (MIT-compatible,
# permissive or weak file-level copyleft). Run: cargo deny check licenses
[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "CC0-1.0",
  "Unlicense",
  "Unicode-3.0",
  "MPL-2.0",
  "BSL-1.0",
]
private = { ignore = true }
unused-allowed-license = "allow"
