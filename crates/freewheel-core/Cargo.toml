[package]
name = "freewheel-core"
version = "1.1.3"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"

[dependencies]
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry", "std"] }

[dev-dependencies]
tempfile = "3"
# ADR-15: the UI's TypeScript types are generated from the serde types.
ts-rs = "12.0"
