[package]
name = "freewheel"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
directories = "6"
enigo = "0.5"
freewheel-core = { path = "../crates/freewheel-core" }
hidapi = { version = "2.6", default-features = false, features = ["linux-native-basic-udev"] }
os_info = { version = "3", default-features = false }
tauri = { version = "2", features = [] }

[target.'cfg(windows)'.dependencies]
serde = { version = "1", features = ["derive"] }
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "0.61", features = ["Win32_Devices_Display", "Win32_Foundation", "Win32_Graphics_Gdi"] }
wmi = "0.17"
