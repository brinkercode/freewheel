[package]
name = "freewheel"
version = "1.1.2"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"

[features]
# Windows e2e builds only: the update e2e (scripts/e2e-update-windows.mjs)
# opens the WebView2 DevTools port (FREEWHEEL_E2E_DEVTOOLS_PORT) in a normal
# run too, not just in --simulate, and points the updater at a local server
# (FREEWHEEL_E2E_UPDATE_URL, src/selfupdate.rs); the --simulate e2e gets
# stand-ins for the OS dialogs (src/e2e.rs). Release builds never enable it
# (release.yml checks the shipped binary has no FREEWHEEL_E2E_UPDATE_URL).
e2e = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Start at login (src/autostart.rs).
auto-launch = "0.6"
base64 = "0.23"
directories = "6"
enigo = "0.6"
freewheel-core = { path = "../crates/freewheel-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The portable self-update (src/selfupdate.rs): semver compare, the
# release file's minisign signature, the download (reqwest is already in
# the tree through tauri; TLS from the OS below).
minisign-verify = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
semver = "1"
hidapi = { version = "2.6", default-features = false, features = ["linux-native-basic-udev"] }
png = "0.18"
os_info = { version = "3", default-features = false }
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tracing = "0.1"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"

# The OS's TLS (Schannel, Security.framework, the system OpenSSL on
# Linux): no TLS stack of our own.
[target.'cfg(any(windows, target_os = "macos", target_os = "linux"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["native-tls-no-alpn"] }

# Linux: the uinput keyboard (libc ioctls), the focused window's pid (X11),
# logind's SetBrightness and the tray-host check (D-Bus), app icons drawn
# from the icon theme (gdk-pixbuf); all already in tauri's tree.
[target.'cfg(target_os = "linux")'.dependencies]
gdk-pixbuf = "0.18"
libc = "0.2"
x11rb = "0.13"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSWorkspace", "NSRunningApplication", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphicsContext", "NSGraphics"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSString", "NSDictionary", "NSGeometry", "NSData", "NSNotification", "NSOperation", "NSURL", "NSBundle"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Registry",
    "Win32_System_Variant",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "0.61", features = ["Win32_Devices_Display", "Win32_Foundation", "Win32_Graphics_Gdi"] }
wmi = "0.18"
