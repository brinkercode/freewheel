[package]
name = "freewheel"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
directories = "6"
enigo = "0.5"
freewheel-core = { path = "../crates/freewheel-core" }
serde_json = "1" # generate_context! embeds plugins.updater through serde_json
hidapi = { version = "2.6", default-features = false, features = ["linux-native-basic-udev"] }
os_info = { version = "3", default-features = false }
tauri = { version = "2", features = [] }
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
