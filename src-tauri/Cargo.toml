[package]
name = "freewheel"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"

[features]
# Windows update e2e builds only (scripts/e2e-update-windows.mjs): the
# WebView2 DevTools port (FREEWHEEL_E2E_DEVTOOLS_PORT) opens in a normal run
# too, not just in --simulate. Release builds never enable it.
e2e = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
directories = "6"
enigo = "0.5"
freewheel-core = { path = "../crates/freewheel-core" }
serde_json = "1" # generate_context! embeds plugins.updater through serde_json
hidapi = { version = "2.6", default-features = false, features = ["linux-native-basic-udev"] }
os_info = { version = "3", default-features = false }
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tracing = "0.1"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
objc2 = "0.6"

[target.'cfg(windows)'.dependencies]
serde = { version = "1", features = ["derive"] }
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "0.61", features = ["Win32_Devices_Display", "Win32_Foundation", "Win32_Graphics_Gdi"] }
wmi = "0.17"
